<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racks Config — Born Again Pallets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .cfg-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
        }
        .cfg-list-item:last-child { border-bottom: none; }
        .cfg-list-item .item-label { flex: 1; }
        .cfg-list-empty { padding: 12px 10px; font-size: 0.85rem; color: var(--text-muted); font-style: italic; }
        .cfg-form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
        .cfg-form-row .form-group { display: flex; flex-direction: column; gap: 3px; }
        .cfg-form-row label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: #2d5a27 !important;">
        <div class="container-fluid">
            <a href="https://www.bornagainpallets.com" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none" style="font-family: Georgia, serif;">
                <i class="fas fa-recycle me-1" style="color:#a8d5a2;"></i>
                <span class="d-none d-sm-inline">Born Again Pallets</span>
                <span class="d-inline d-sm-none">BAP</span>
                <small class="d-none d-md-inline fw-normal opacity-75" style="font-size:0.6em;"> — Racks Config</small>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="/" class="btn btn-light btn-sm">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="d-none d-md-inline"> Schedule</span>
                </a>
                <a href="/racks" class="btn btn-light btn-sm">
                    <i class="fas fa-warehouse"></i>
                    <span class="d-none d-md-inline"> Racks</span>
                </a>
                <a href="/racks/stock" class="btn btn-light btn-sm">
                    <i class="fas fa-boxes"></i>
                    <span class="d-none d-md-inline"> Stock</span>
                </a>
                <a href="/racks/stock-dashboard" class="btn btn-light btn-sm">
                    <i class="fas fa-chart-bar"></i>
                    <span class="d-none d-md-inline"> Stock Dashboard</span>
                </a>
                <button id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                    <span class="d-none d-sm-inline">Dark Mode</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">

        <div id="alertArea" class="mb-3"></div>

        <div class="row g-3">

            <!-- Types -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-tag me-2" style="color:#2d5a27;"></i>
                        <strong>Types</strong>
                        <span class="text-muted small ms-2">Item type names</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="typesList" class="cfg-list-empty">Loading…</div>
                    </div>
                    <div class="card-footer">
                        <div class="cfg-form-row">
                            <div class="form-group" style="flex:1;">
                                <label for="typeNameInput">Name</label>
                                <input type="text" id="typeNameInput" class="form-control form-control-sm" placeholder="e.g. Stringers">
                            </div>
                            <button class="btn btn-sm btn-success" id="addTypeBtn">
                                <i class="fas fa-plus me-1"></i> Add
                            </button>
                        </div>
                        <div id="typeError" class="text-danger small mt-1 d-none"></div>
                    </div>
                </div>
            </div>

            <!-- Dimensions -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-ruler-combined me-2" style="color:#2d5a27;"></i>
                        <strong>Dimensions</strong>
                        <span class="text-muted small ms-2">Thickness × Width per type</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="dimsList" class="cfg-list-empty">Loading…</div>
                    </div>
                    <div class="card-footer">
                        <div class="cfg-form-row">
                            <div class="form-group" style="min-width:110px;">
                                <label for="dimTypeSelect">Type</label>
                                <select id="dimTypeSelect" class="form-select form-select-sm">
                                    <option value="">— select —</option>
                                </select>
                            </div>
                            <div class="form-group" style="width:90px;">
                                <label for="dimThicknessInput">Thickness</label>
                                <input type="text" id="dimThicknessInput" class="form-control form-control-sm" placeholder="e.g. 12-15">
                            </div>
                            <div class="form-group" style="width:90px;">
                                <label for="dimWidthInput">Width</label>
                                <input type="text" id="dimWidthInput" class="form-control form-control-sm" placeholder="e.g. 65-85">
                            </div>
                            <button class="btn btn-sm btn-success" id="addDimBtn">
                                <i class="fas fa-plus me-1"></i> Add
                            </button>
                        </div>
                        <div id="dimError" class="text-danger small mt-1 d-none"></div>
                    </div>
                </div>
            </div>

            <!-- Units -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-cube me-2" style="color:#2d5a27;"></i>
                        <strong>Units</strong>
                        <span class="text-muted small ms-2">Container size (mm)</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="unitsList" class="cfg-list-empty">Loading…</div>
                    </div>
                    <div class="card-footer">
                        <div class="cfg-form-row">
                            <div class="form-group" style="flex:1;min-width:90px;">
                                <label for="unitNameInput">Name</label>
                                <input type="text" id="unitNameInput" class="form-control form-control-sm" placeholder="e.g. Stillage">
                            </div>
                            <div class="form-group" style="width:72px;">
                                <label for="unitLengthInput">Length</label>
                                <input type="text" id="unitLengthInput" class="form-control form-control-sm" placeholder="mm">
                            </div>
                            <div class="form-group" style="width:72px;">
                                <label for="unitWidthInput">Width</label>
                                <input type="text" id="unitWidthInput" class="form-control form-control-sm" placeholder="mm">
                            </div>
                            <div class="form-group" style="width:72px;">
                                <label for="unitHeightInput">Height</label>
                                <input type="text" id="unitHeightInput" class="form-control form-control-sm" placeholder="mm">
                            </div>
                            <button class="btn btn-sm btn-success" id="addUnitBtn">
                                <i class="fas fa-plus me-1"></i> Add
                            </button>
                        </div>
                        <div id="unitError" class="text-danger small mt-1 d-none"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/racks_config.js') }}"></script>
</body>
</html>
