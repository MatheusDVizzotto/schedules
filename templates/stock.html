<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock — Born Again Pallets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .stock-table th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stock-table td { vertical-align: middle; }
        .stock-table .form-control,
        .stock-table .form-select { font-size: 0.9rem; }
        .btn-delete-row { padding: 3px 8px; }
        .qty-on-hand { font-weight: 600; font-size: 0.95rem; }
        .qty-unit { font-size: 0.78rem; color: var(--text-muted); font-weight: normal; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: #2d5a27 !important;">
        <div class="container-fluid">
            <a href="https://www.bornagainpallets.com" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none" style="font-family: Georgia, serif;">
                <i class="fas fa-recycle me-1" style="color:#a8d5a2;"></i>
                <span class="d-none d-sm-inline">Born Again Pallets</span>
                <span class="d-inline d-sm-none">BAP</span>
                <small class="d-none d-md-inline fw-normal opacity-75" style="font-size:0.6em;"> — Stock</small>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="/" class="btn btn-light btn-sm">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="d-none d-md-inline"> Schedule</span>
                </a>
                <a href="/dashboard" class="btn btn-light btn-sm">
                    <i class="fas fa-th-large"></i>
                    <span class="d-none d-md-inline"> Schedule Dashboard</span>
                </a>
                <a href="/racks" class="btn btn-light btn-sm">
                    <i class="fas fa-warehouse"></i>
                    <span class="d-none d-md-inline"> Racks</span>
                </a>
                <button id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                    <span class="d-none d-sm-inline">Dark Mode</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">

        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <i class="fas fa-boxes me-2" style="color:#2d5a27;"></i>
                    <strong>Stock</strong>
                    <span class="text-muted small ms-2">Standard sizes — saved to Google Sheets</span>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-primary" id="addItemBtn">
                        <i class="fas fa-plus me-1"></i> Add Item
                    </button>
                    <button class="btn btn-sm btn-success" id="saveBtn">
                        <i class="fas fa-save me-1"></i> Save
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="alertArea" class="px-3 pt-3"></div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover stock-table mb-0" id="stockTable">
                        <thead class="table-light">
                            <tr>
                                <th style="width:160px;">Size</th>
                                <th style="width:130px;">Item Type</th>
                                <th style="width:180px;">Dimensions</th>
                                <th style="width:130px;" class="text-center">Qty On Hand</th>
                                <th style="width:130px;">Min On Hand</th>
                                <th style="width:130px;">Max On Hand</th>
                                <th style="width:50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="stockBody">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    Loading…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/item_options.js') }}"></script>
    <script src="{{ url_for('static', filename='js/stock.js') }}"></script>
</body>
</html>
