<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard — Born Again Pallets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .filter-block-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            font-weight: 700;
            color: #2d5a27;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #2d5a27;
        }
        .section-title { border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
        .card-header { background: var(--header-bg); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: #2d5a27 !important;">
        <div class="container-fluid">
            <a href="https://www.bornagainpallets.com" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none" style="font-family: Georgia, serif;">
                <i class="fas fa-recycle me-1" style="color:#a8d5a2;"></i>
                <span class="d-none d-sm-inline">Born Again Pallets</span>
                <span class="d-inline d-sm-none">BAP</span>
                <small class="d-none d-md-inline fw-normal opacity-75" style="font-size:0.6em;"> — Stock Dashboard</small>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="/" class="btn btn-light btn-sm">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="d-none d-md-inline"> Schedule</span>
                </a>
                <a href="/racks" class="btn btn-light btn-sm">
                    <i class="fas fa-warehouse"></i>
                    <span class="d-none d-md-inline"> Racks</span>
                </a>
                <a href="/racks/stock" class="btn btn-light btn-sm">
                    <i class="fas fa-boxes"></i>
                    <span class="d-none d-md-inline"> Stock</span>
                </a>
                <button id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                    <span class="d-none d-sm-inline">Dark Mode</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">

        <!-- Loading spinner -->
        <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <div class="mt-2 text-muted">Loading stock data…</div>
        </div>

        <!-- Filter panel -->
        <div class="card mb-4 d-none" id="filterPanel">
            <div class="card-header py-2 d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-filter me-2" style="color:#2d5a27;"></i>
                    <strong>Filter by Size</strong>
                    <span class="text-muted small ms-2">Select one or more sizes to view their stock</span>
                    <span id="lastRefreshed" class="text-muted small ms-3 fst-italic"></span>
                </div>
                <button class="btn btn-sm btn-outline-secondary" id="toggleFiltersBtn" onclick="toggleFilters()">
                    <i class="fas fa-chevron-up me-1"></i> Hide Filters
                </button>
            </div>
            <div class="card-body">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="filter-block-title"><i class="fas fa-border-all me-1"></i> Boards</div>
                        <div id="filter-boards"></div>
                    </div>
                    <div class="col-md-4">
                        <div class="filter-block-title"><i class="fas fa-minus me-1"></i> Bearers</div>
                        <div id="filter-bearers"></div>
                    </div>
                    <div class="col-md-4">
                        <div class="filter-block-title"><i class="fas fa-cube me-1"></i> Blocks</div>
                        <div id="filter-blocks"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard area -->
        <div id="dashboardArea" class="d-none"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/item_options.js') }}"></script>
    <script src="{{ url_for('static', filename='js/stock_dashboard.js') }}"></script>
</body>
</html>
