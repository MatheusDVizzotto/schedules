<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dashboard — Born Again Pallets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
    <style>
        .worker-card {
            border-radius: 12px;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .worker-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.13);
        }
        .worker-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            flex-shrink: 0;
            color: #fff;
        }
        .time-badge {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .machine-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .shift-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 4px 0 6px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .notes-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            overflow-wrap: break-word;
        }
        #dateDisplay {
            font-size: 1.05rem;
            font-weight: 600;
        }
        .no-schedule {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .no-schedule i { font-size: 3rem; opacity: 0.3; margin-bottom: 16px; display: block; }

        /* Avatar colours */
        .av-0 { background: #3b82f6; }
        .av-1 { background: #10b981; }
        .av-2 { background: #f59e0b; }
        .av-3 { background: #ef4444; }
        .av-4 { background: #8b5cf6; }
        .av-5 { background: #06b6d4; }
        .av-6 { background: #f97316; }
        .av-7 { background: #ec4899; }

        @media (max-width: 575px) {
            .worker-avatar { width: 42px; height: 42px; font-size: 1rem; }
            .time-badge { font-size: 0.82rem; }
        }
    </style>
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Minimal header — branding + dark mode only, no nav links -->
    <nav class="navbar navbar-dark" style="background-color: #2d5a27 !important;">
        <div class="container-fluid">
            <a href="https://www.bornagainpallets.com" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none" style="font-family: Georgia, serif;">
                <i class="fas fa-recycle me-1" style="color:#a8d5a2;"></i>
                <span class="d-none d-sm-inline">Born Again Pallets</span>
                <span class="d-inline d-sm-none">BAP</span>
                <small class="d-none d-md-inline fw-normal opacity-75" style="font-size:0.6em;"> — Daily Schedule</small>
            </a>
            <button id="darkModeToggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
                <span class="d-none d-sm-inline">Dark Mode</span>
            </button>
        </div>
    </nav>

    <div class="container-fluid mt-3 mt-md-4">

        <!-- Date navigation -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
            <button class="btn btn-outline-secondary btn-sm" id="prevDay" title="Previous day">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="d-flex align-items-center gap-2">
                <span id="dateDisplay">—</span>
                <input type="date" id="dashboardDate" class="form-control form-control-sm"
                       style="width: auto;" title="Pick a date">
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="nextDay" title="Next day">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn btn-sm btn-outline-primary" id="todayBtn">
                <i class="fas fa-calendar-day"></i> Today
            </button>
            <button class="btn btn-sm btn-outline-secondary ms-auto" id="refreshBtn" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Dashboard cards -->
        <div id="dashboardContent">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Loading schedule…</p>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
