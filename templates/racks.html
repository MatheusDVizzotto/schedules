<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racks Management — Born Again Pallets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="icon" href="https://www.bornagainpallets.com/favicon.ico" type="image/x-icon">
    <script>
        (function(){
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .racks-table th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .racks-table td { vertical-align: middle; }
        .racks-table .form-control,
        .racks-table .form-select { font-size: 0.9rem; }
        .qty-unit { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
        .btn-delete-row { padding: 3px 8px; }
        .location-chip {
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--header-bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 3px 12px; font-size: 0.82rem;
            cursor: pointer; user-select: none; transition: background 0.15s, border-color 0.15s;
        }
        .location-chip:hover { background: #d4edcc; border-color: #2d5a27; }
        .location-chip-active { background: #2d5a27 !important; color: #fff !important; border-color: #2d5a27 !important; }
        .location-chip-active i { color: #fff !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: #2d5a27 !important;">
        <div class="container-fluid">
            <a href="https://www.bornagainpallets.com" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none" style="font-family: Georgia, serif;">
                <i class="fas fa-recycle me-1" style="color:#a8d5a2;"></i>
                <span class="d-none d-sm-inline">Born Again Pallets</span>
                <span class="d-inline d-sm-none">BAP</span>
                <small class="d-none d-md-inline fw-normal opacity-75" style="font-size:0.6em;"> — Racks Management</small>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="/" class="btn btn-light btn-sm">
                    <i class="fas fa-calendar-alt"></i>
                    <span class="d-none d-md-inline"> Schedule</span>
                </a>
                <a href="/racks/stock" class="btn btn-light btn-sm">
                    <i class="fas fa-boxes"></i>
                    <span class="d-none d-md-inline"> Stock</span>
                </a>
                <a href="/racks/stock-dashboard" class="btn btn-light btn-sm">
                    <i class="fas fa-chart-bar"></i>
                    <span class="d-none d-md-inline"> Stock Dashboard</span>
                </a>
                <button id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                    <span class="d-none d-sm-inline">Dark Mode</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">

        <!-- Locations panel -->
        <div class="card mb-3">
            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <i class="fas fa-map-marker-alt me-2" style="color:#2d5a27;"></i>
                    <strong>Locations</strong>
                    <span class="text-muted small ms-2">Each location is saved as a separate tab in Google Sheets</span>
                </div>
                <button class="btn btn-sm btn-outline-primary" id="addLocationBtn">
                    <i class="fas fa-plus me-1"></i> Add Location
                </button>
            </div>
            <div class="card-body py-2">
                <div id="locationsPanel" class="d-flex flex-wrap gap-2 align-items-center">
                    <span class="text-muted small fst-italic">Loading…</span>
                </div>
            </div>
        </div>

        <!-- Add location inline form (hidden by default) -->
        <div class="card mb-3 d-none" id="addLocationForm">
            <div class="card-body py-2">
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <label class="fw-semibold small mb-0">New Location Name:</label>
                    <input type="text" id="newLocationName" class="form-control form-control-sm" style="width:220px;" placeholder="e.g. Warehouse A">
                    <button class="btn btn-sm btn-success" id="confirmAddLocation">
                        <i class="fas fa-check me-1"></i> Create
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" id="cancelAddLocation">Cancel</button>
                </div>
                <div id="locationError" class="text-danger small mt-1 d-none"></div>
            </div>
        </div>

        <!-- Racks table -->
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div>
                    <i class="fas fa-warehouse me-2" style="color:#2d5a27;"></i>
                    <strong>Bays</strong>
                    <span class="text-muted small ms-2">Saved to Google Sheets — racks_management</span>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-primary" id="addBayBtn">
                        <i class="fas fa-plus me-1"></i> Add Bay
                    </button>
                    <button class="btn btn-sm btn-success" id="saveBtn">
                        <i class="fas fa-save me-1"></i> Save
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="alertArea" class="px-3 pt-3"></div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover racks-table mb-0" id="racksTable">
                        <thead class="table-light">
                            <tr>
                                <th style="width:170px;">Location</th>
                                <th style="width:160px;">Bay Code</th>
                                <th>Size Preferable</th>
                                <th>Actual Size</th>
                                <th style="width:210px;">Quantity</th>
                                <th style="width:130px;">Item Type</th>
                                <th style="width:180px;">Dimensions</th>
                                <th style="width:50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="racksBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                    Loading…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/item_options.js') }}"></script>
    <script src="{{ url_for('static', filename='js/racks.js') }}"></script>
</body>
</html>
